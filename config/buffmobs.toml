[mobFilter]
	#If true, only mobs in the whitelist are buffed
	useWhitelist = false
	#Mob IDs to buff (used when useWhitelist = true)
	whitelist = []
	#Mob IDs to never buff
	blacklist = ["minecraft:warden"]

[modidFilter]
	#If true, only mobs from whitelisted mods are buffed
	useWhitelist = false
	#Mod IDs to buff
	whitelist = []
	#Mod IDs to never buff
	blacklist = []

[dimensionFilter]
	#If true, only buff mobs in whitelisted dimensions
	useWhitelist = false
	#Dimensions where mobs are buffed (useWhitelist = true)
	whitelist = ["minecraft:overworld", "minecraft:the_nether", "minecraft:the_end"]
	#Dimensions where mobs are never buffed
	blacklist = []

[rangedMeleeSwitching]
	#Enable ranged mob close-range behavior
	enabled = true
	#MELEE: ranged mobs switch to sword when player is close.
	#KITE:  ranged mobs run away to maintain distance.
	#RANDOM: each mob randomly picks MELEE or KITE on spawn.
	#Allowed Values: MELEE, KITE, RANDOM
	behaviorMode = "RANDOM"
	#Distance threshold that triggers the behavior
	# Default: 4.0
	# Range: 1.0 ~ 16.0
	switchDistance = 4.0
	#Speed multiplier when in melee mode
	# Default: 0.9
	# Range: 0.1 ~ 5.0
	meleeSpeedMultiplier = 0.9
	#Additional mob IDs treated as ranged
	customRangedMobs = []
	# Default: 0
	# Range: 0 ~ 365
	stoneSwordUnlockDay = 0
	# Default: 7
	# Range: 0 ~ 365
	ironSwordUnlockDay = 7
	# Default: 21
	# Range: 0 ~ 365
	diamondSwordUnlockDay = 21
	# Default: 60
	# Range: 0 ~ 365
	netheriteSwordUnlockDay = 60
	# Default: 0
	# Range: 0 ~ 365
	goldenAxeUnlockDay = 0
	# Default: 14
	# Range: 0 ~ 365
	diamondAxeUnlockDay = 14
	# Default: 45
	# Range: 0 ~ 365
	netheriteAxeUnlockDay = 45
	#Enable enchantments on generated melee weapons
	enchantmentsEnabled = true
	# Default: 2
	# Range: 1 ~ 4
	maxEnchantmentsPerWeapon = 2
	# Default: 7
	# Range: 1 ~ 30
	daysPerEnchantmentLevel = 7
	# Default: 0
	# Range: 0 ~ 365
	sharpnessUnlockDay = 0
	# Default: 5
	# Range: 1 ~ 5
	sharpnessMaxLevel = 5
	# Default: 14
	# Range: 0 ~ 365
	fireAspectUnlockDay = 14
	# Default: 2
	# Range: 1 ~ 2
	fireAspectMaxLevel = 2
	# Default: 7
	# Range: 0 ~ 365
	knockbackUnlockDay = 7
	# Default: 2
	# Range: 1 ~ 2
	knockbackMaxLevel = 2
	# Default: 21
	# Range: 0 ~ 365
	sweepingEdgeUnlockDay = 21
	# Default: 3
	# Range: 1 ~ 3
	sweepingEdgeMaxLevel = 3

[combatDraft]
	#Enable CombatDraft: hostile/neutral mobs drink a regeneration potion when low on health.
	enabled = true
	#HP fraction that triggers the potion (0.20 = 20% of max HP).
	# Default: 0.2
	# Range: 0.01 ~ 0.99
	healthThreshold = 0.2
	#Regeneration effect level (1 = Regen I, 4 = Regen IV). Default 4.
	# Default: 4
	# Range: 1 ~ 10
	regenAmplifier = 4
	#Regeneration duration in seconds.
	# Default: 10
	# Range: 1 ~ 120
	regenDuration = 10
	#Ticks before the mob can use CombatDraft again. Default 600 (30 s).
	# Default: 600
	# Range: 20 ~ 72000
	cooldownTicks = 600
	#Max times a mob can use CombatDraft per life. 0 = unlimited.
	# Default: 0
	# Range: 0 ~ 100
	maxUses = 0
	#If true, only mobs in 'whitelist' can use CombatDraft.
	useWhitelist = false
	#Mob IDs allowed to use CombatDraft (only when useWhitelist = true).
	whitelist = []
	#Mob IDs that cannot use CombatDraft (always applied). Slime, magma_cube and ghast are hardcoded.
	blacklist = []

[mobPresets]
	#Enable per-mob stat presets
	enabled = false
	#If true, mobs that have a matching preset ignore dimensionScaling multipliers and only use the preset values.
	overrideDimensionScaling = false
	#Mob-to-preset mapping, format: modid:mob_id:preset_name
