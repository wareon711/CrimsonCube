[general]
	#Enable or disable the mod entirely
	enabled = true
	#Show visual particles for status effects
	visualEffects = true

[dayScaling]
	#Enable day-based difficulty scaling
	enabled = false
	#Days between each scaling increase
	# Default: 7
	# Range: 1 ~ 365
	interval = 7
	#Multiplier added per interval
	# Default: 0.1
	# Range: 0.01 ~ 999999.0
	multiplier = 0.1
	#Maximum scaling multiplier
	# Default: 5.0
	# Range: 0.0 ~ 999999.0
	maxMultiplier = 5.0
	#Show day scaling notifications to players
	showNotifications = true
	#When to send notifications: EVERY_DAY or SCALING_INCREASE_ONLY
	#Allowed Values: EVERY_DAY, SCALING_INCREASE_ONLY
	notificationMode = "EVERY_DAY"

[attributes]
	#Health multiplier for mobs
	# Default: 1.5
	# Range: 0.1 ~ 999999.0
	healthMultiplier = 1.5
	#Damage multiplier for mobs
	# Default: 1.5
	# Range: 0.1 ~ 999999.0
	damageMultiplier = 1.5
	#Speed multiplier for mobs
	# Default: 1.0
	# Range: 0.1 ~ 999999.0
	speedMultiplier = 1.0
	#Attack speed multiplier for mobs
	# Default: 1.0
	# Range: 0.1 ~ 999999.0
	attackSpeedMultiplier = 1.0
	#Armor points added to mobs
	# Default: 5.0
	# Range: 0.0 ~ 999999.0
	armorAddition = 5.0
	#Armor toughness added to mobs
	# Default: 0.0
	# Range: 0.0 ~ 999999.0
	armorToughnessAddition = 0.0

[effects]
	#Effect duration in seconds, -1 for infinite
	# Default: -1
	# Range: -1 ~ 7200
	duration = -1
	#Strength effect level (0 = disabled)
	# Default: 0
	# Range: 0 ~ 10
	strengthAmplifier = 0
	#Speed effect level (0 = disabled)
	# Default: 0
	# Range: 0 ~ 10
	speedAmplifier = 0
	#Resistance effect level (0 = disabled)
	# Default: 0
	# Range: 0 ~ 10
	resistanceAmplifier = 0
	#Regeneration effect level (0 = disabled, skipped for undead)
	# Default: 0
	# Range: 0 ~ 10
	regenerationAmplifier = 0
	#Absorption effect level (0 = disabled)
	# Default: 0
	# Range: 0 ~ 10
	absorptionAmplifier = 0

[harmfulEffects]
	#Enable harmful effects applied to players on hit
	enabled = true
	#Chance of applying a harmful effect per hit (0.0-1.0)
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	chance = 0.15
	#Poison duration in seconds
	# Default: 5
	# Range: 1 ~ 60
	poisonDuration = 5
	#Slowness duration in seconds
	# Default: 3
	# Range: 1 ~ 60
	slownessDuration = 3
	#Wither duration in seconds
	# Default: 3
	# Range: 1 ~ 60
	witherDuration = 3

[dimensionScaling]
	#Select scaling mode: SCALING (multiply base attributes) or OVERRIDE (replace with fixed multipliers)
	#Allowed Values: SCALING, OVERRIDE
	mode = "SCALING"

